# Validates repo standards and checks markdown.
# Called by ci.yml
name: Repo Standard

on:
  workflow_call:

jobs:
  validate:
    name: Validate
    uses: ai-cfia/github-workflows/.github/workflows/workflow-repo-standards-validation.yml@main
    secrets: inherit

  markdown-check:
    name: Markdown Check
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v6
      - uses: DavidAnson/markdownlint-cli2-action@ded1f9488f68a970bc66ea5619e13e9b52e601cd # v23
        with:
          globs: "**/*.md"
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
      - name: Check Markdown links
        run: |
          mapfile -d '' -t markdown_files < <(git ls-files -z -- '*.md')
          npx --yes markdown-link-check@3.15.0 \
            --ignore backend/app/data/law/markdown \
            "${markdown_files[@]}"
